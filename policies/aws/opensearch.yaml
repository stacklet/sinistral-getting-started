policies:
  - name: opensearch-enforce-https
    # Cover both the current opensearch and legacy elasticsearch resources
    resource: terraform.aws_opensearch_domain
    description: >
      Identify OpenSearch clusters which support plain HTTP
      connections. This presents a risk to both data integrity and
      confidentiality.
    metadata:
      severity: critical
      creator: Stacklet
    filters:
      - type: value
        key: domain_endpoint_options.enforce_https
        value: false

  - name: elasticsearch-enforce-https
    # Cover both the current opensearch and legacy elasticsearch resources
    resource: terraform.aws_elasticsearch_domain
    description: >
      Identify ElasticSearch clusters which support plain HTTP
      connections. This presents a risk to both data integrity and
      confidentiality.
    metadata:
      severity: critical
      creator: Stacklet
    filters:
      - type: value
        key: domain_endpoint_options.enforce_https
        value: false

  - name: elasticsearch-using-gp2-volume
    resource: terraform.aws_elasticsearch_domain
    mode:
      type: terraform-source
    description: >
      For better performance and cost efficiency, use gp3 volumes instead of gp2.
    metadata:
      category:
        - efficient-ebs-usage
      severity: HIGH
    filters:
      - type: value
        op: equal
        key: ebs_options.volume_type
        value: gp2
