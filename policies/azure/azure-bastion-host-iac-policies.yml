  # Virtual Network Policies
  - name: azure-vnet-required-tags
    resource: terraform.azurerm_virtual_network
    description: |
      Ensures virtual networks have required tags.
      Required tags improve network governance and cost tracking.
    filters:
      - or:
        - type: value
          key: tags.environment
          value: absent
        - type: value
          key: tags.owner
          value: absent
    metadata:
      severity: LOW
      creator: Stacklet