  - name: azure-storage-shared-key-disabled
    resource: terraform.azurerm_storage_account
    description: |
      Ensures Storage Accounts have shared key access disabled.
      Use managed identities instead of shared keys for better security.
    filters:
      - or:
        - type: value
          key: shared_access_key_enabled
          value: true
        - type: value
          key: shared_access_key_enabled
          value: absent
    metadata:
      severity: MEDIUM
      creator: Stacklet

  - name: azure-storage-blob-soft-delete-retention
    resource: terraform.azurerm_storage_account
    description: |
      Ensures Storage Accounts have adequate blob soft delete retention.
      Minimum 7 days recommended for recovery from accidental deletion.
    filters:
      - or:
        - type: value
          key: blob_properties[0].delete_retention_policy
          value: absent
        - type: value
          key: blob_properties[0].delete_retention_policy[0].days
          value: 7
          op: lt
    metadata:
      severity: MEDIUM
      creator: Stacklet

