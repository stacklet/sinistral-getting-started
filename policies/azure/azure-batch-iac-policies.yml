  # Subnet Policies
  - name: azure-subnet-service-endpoints-configured
    resource: terraform.azurerm_subnet
    description: |
      Detects subnets without service endpoints for Azure services.
      Service endpoints improve security and performance for Azure services.
    filters:
      - type: value
        key: service_endpoints
        value: absent
    metadata:
      severity: LOW
      creator: Stacklet

