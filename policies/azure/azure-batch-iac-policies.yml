# Cloud Custodian Shift Left Policies for Azure Batch
# These policies scan Terraform configurations for Batch security misconfigurations

policies:
  # Batch Account Policies
  - name: azure-batch-public-network-disabled
    resource: terraform.azurerm_batch_account
    description: |
      Ensures Azure Batch Account has public network access disabled.
      Use private endpoints for secure access to Batch services.
    filters:
      - or:
        - type: value
          key: public_network_access_enabled
          value: true
        - type: value
          key: public_network_access_enabled
          value: absent
    metadata:
      severity: HIGH
      creator: Stacklet

  - name: azure-batch-managed-identity-required
    resource: terraform.azurerm_batch_account
    description: |
      Ensures Azure Batch Account has managed identity configured.
      Managed identity eliminates need for storage account keys.
    filters:
      - type: value
        key: identity
        value: absent
    metadata:
      severity: MEDIUM
      creator: Stacklet

  - name: azure-batch-storage-authentication-managed-identity
    resource: terraform.azurerm_batch_account
    description: |
      Ensures Batch uses managed identity for storage authentication.
      Managed identity is more secure than storage keys.
    filters:
      - type: value
        key: storage_account_authentication_mode
        value: StorageKeys
    metadata:
      severity: HIGH
      creator: Stacklet

  - name: azure-batch-customer-managed-keys
    resource: terraform.azurerm_batch_account
    description: |
      Ensures Azure Batch Account uses customer-managed keys for encryption.
      CMK provides additional control over data encryption.
    filters:
      - type: value
        key: key_vault_reference
        value: absent
    metadata:
      severity: MEDIUM
      creator: Stacklet

  - name: azure-batch-authentication-modes-restrictive
    resource: terraform.azurerm_batch_account
    description: |
      Ensures Batch authentication modes are restrictive.
      SharedKey should be disabled in favor of AAD authentication.
    filters:
      - type: value
        key: allowed_authentication_modes
        value: "SharedKey"
        op: in
    metadata:
      severity: MEDIUM
      creator: Stacklet

  - name: azure-batch-required-tags
    resource: terraform.azurerm_batch_account
    description: |
      Ensures Azure Batch Account has required tags for governance.
      Required tags: environment, owner, compliance, cost-center
    filters:
      - or:
        - type: value
          key: tags.owner
          value: absent
        - type: value
          key: tags.compliance
          value: absent
        - type: value
          key: tags.cost-center
          value: absent
    metadata:
      severity: LOW
      creator: Stacklet

  - name: azure-batch-user-subscription-mode-key-vault
    resource: terraform.azurerm_batch_account
    description: |
      Ensures Batch accounts in UserSubscription mode have Key Vault configured.
      UserSubscription mode requires Key Vault reference for pool creation.
    filters:
      - and:
        - type: value
          key: pool_allocation_mode
          value: UserSubscription
        - type: value
          key: key_vault_reference
          value: absent
    metadata:
      severity: CRITICAL
      creator: Stacklet

  # Batch Pool Policies
  - name: azure-batch-pool-autoscale-enabled
    resource: terraform.azurerm_batch_pool
    description: |
      Ensures Batch pools use autoscale for cost optimization.
      Autoscale adjusts compute resources based on workload demand.
    filters:
      - type: value
        key: auto_scale
        value: absent
    metadata:
      severity: MEDIUM
      creator: Stacklet

  - name: azure-batch-pool-start-task-non-admin
    resource: terraform.azurerm_batch_pool
    description: |
      Ensures Batch pool start tasks run with non-admin privileges.
      Admin elevation increases security risk from compromised tasks.
    filters:
      - type: value
        key: start_task[0].user_identity[0].auto_user[0].elevation_level
        value: Admin
    metadata:
      severity: HIGH
      creator: Stacklet

  - name: azure-batch-pool-network-configuration
    resource: terraform.azurerm_batch_pool
    description: |
      Ensures Batch pools have network configuration for subnet injection.
      Subnet injection enables private networking and enhanced security.
    filters:
      - type: value
        key: network_configuration
        value: absent
    metadata:
      severity: MEDIUM
      creator: Stacklet

  - name: azure-batch-pool-no-public-ips
    resource: terraform.azurerm_batch_pool
    description: |
      Ensures Batch pool nodes do not have public IP addresses.
      Public IPs increase attack surface and security risk.
    filters:
      - type: value
        key: network_configuration[0].public_ip_address_configuration[0].provision
        value: BatchManaged
    metadata:
      severity: HIGH
      creator: Stacklet

  - name: azure-batch-pool-task-scheduling-pack
    resource: terraform.azurerm_batch_pool
    description: |
      Ensures Batch pools use Pack scheduling for cost optimization.
      Pack scheduling maximizes node utilization and reduces costs.
    filters:
      - type: value
        key: task_scheduling_policy[0].node_fill_type
        value: Spread
    metadata:
      severity: LOW
      creator: Stacklet

  - name: azure-batch-pool-certificate-configured
    resource: terraform.azurerm_batch_pool
    description: |
      Detects Batch pools without certificates for secure communication.
      Certificates enable encrypted node-to-node communication.
    filters:
      - type: value
        key: certificate
        value: absent
    metadata:
      severity: LOW
      creator: Stacklet

