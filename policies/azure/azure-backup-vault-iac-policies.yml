  # VM Protection Policies
  - name: azure-vm-backup-protection-missing
    resource: terraform.azurerm_linux_virtual_machine
    description: |
      Detects VMs that may not have backup protection configured.
      All production VMs should have backup enabled.
      Note: This is a warning as protection may be in separate configs.
    filters:
      - type: value
        key: name
        value: present
    metadata:
      severity: LOW
      creator: Stacklet

  - name: azure-windows-vm-backup-protection-missing
    resource: terraform.azurerm_windows_virtual_machine
    description: |
      Detects Windows VMs that may not have backup protection configured.
      All production VMs should have backup enabled.
      Note: This is a warning as protection may be in separate configs.
    filters:
      - type: value
        key: name
        value: present
    metadata:
      severity: LOW
      creator: Stacklet