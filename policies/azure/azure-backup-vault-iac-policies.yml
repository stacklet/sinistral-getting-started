  # Log Analytics Policies
  - name: azure-log-analytics-retention-minimum-90-days
    resource: terraform.azurerm_log_analytics_workspace
    description: |
      Ensures Log Analytics workspace has minimum 90-day retention.
      Longer retention meets most compliance requirements for audit logs.
    filters:
      - type: value
        key: retention_in_days
        value: 90
        op: lt
    metadata:
      severity: MEDIUM
      creator: Stacklet

